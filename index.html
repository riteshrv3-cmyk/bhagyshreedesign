<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhagyshree Design | Ladies Tailor and Fashion Designer, Wagholi, Pune</title>
<meta name="description" content="Bhagyshree Design, Wagholi, Pune. Custom blouses, salwar suits, kurtis, lehengas and gowns with perfect fitting. 20+ years of experience. Affordable prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#top">Bhagyshree <span>Design</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="mr" aria-pressed="false">मराठी</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="ornament">&#10022; &#10022; &#10022;</div>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn btn-wa" data-wa data-i18n="btn_wa" href="#visit"></a>
        <a class="btn btn-ghost" data-call data-i18n="btn_call" href="#visit"></a>
      </div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="eyebrow" data-i18n="services_eyebrow"></div>
      <h2 data-i18n="services_title"></h2>
      <div class="grid">
        <div class="card"><div class="ico">&#128090;</div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div>
        <div class="card"><div class="ico">&#127800;</div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div>
        <div class="card"><div class="ico">&#128081;</div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div>
        <div class="card"><div class="ico">&#9986;&#65039;</div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></div>
      </div>
    </div>
  </section>

  <section class="why">
    <div class="wrap">
      <div class="eyebrow" data-i18n="why_eyebrow"></div>
      <h2 data-i18n="why_title"></h2>
      <div class="grid">
        <div class="card"><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p></div>
        <div class="card"><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p></div>
        <div class="card"><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p></div>
        <div class="card"><h3 data-i18n="w4_t"></h3><p data-i18n="w4_d"></p></div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <span class="badge" data-i18n="about_badge"></span>
      <h2 data-i18n="about_title"></h2>
      <p data-i18n="about_text"></p>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <div class="eyebrow" data-i18n="work_eyebrow"></div>
      <h2 data-i18n="work_title"></h2>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="visit" class="visit">
    <div class="wrap">
      <div class="eyebrow" data-i18n="visit_eyebrow"></div>
      <h2 data-i18n="visit_title"></h2>
      <dl>
        <div><dt data-i18n="visit_addr"></dt><dd id="addr"></dd></div>
        <div><dt data-i18n="visit_hours"></dt><dd id="hours"></dd></div>
      </dl>
      <div class="cta" style="justify-content:flex-start">
        <a class="btn btn-wa" data-wa data-i18n="btn_wa" href="#visit"></a>
        <a class="btn btn-call" data-call data-i18n="btn_call" href="#visit"></a>
        <a class="btn btn-ghost" id="mapBtn" target="_blank" rel="noopener" data-i18n="btn_map" href="#visit"></a>
      </div>
    </div>
  </section>
</main>

<footer><span data-i18n="footer"></span> <a id="igLink" hidden target="_blank" rel="noopener">Instagram</a></footer>
<a class="fab" data-wa data-i18n="btn_wa" href="#visit"></a>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
