<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhagyshree Design | Ladies Tailor and Designer in Wagholi, Pune</title>
<meta name="description" content="Bhagyshree Design, Sai Park Society, opposite Raisoni College, Wagholi, Pune. Custom blouses, salwar suits, kurtis, lehengas and gowns with perfect fitting. 20+ years of experience. Open every day, 10 am to 8 pm. WhatsApp +91 78230 06185.">
<meta property="og:title" content="Bhagyshree Design, Wagholi, Pune">
<meta property="og:description" content="Custom blouses, suits, lehengas and gowns, stitched to fit. 20+ years of experience.">
<meta property="og:image" content="https://riteshrv3-cmyk.github.io/bhagyshreedesign/images/og-cover.jpg">
<meta property="og:url" content="https://riteshrv3-cmyk.github.io/bhagyshreedesign/">
<link rel="canonical" href="https://riteshrv3-cmyk.github.io/bhagyshreedesign/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6efe2">
<link rel="icon" href="images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Mukta:wght@300;400;600&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ClothingStore",
  "name": "Bhagyshree Design",
  "description": "Ladies tailor and fashion designer: custom blouses, salwar suits, kurtis, lehengas and gowns.",
  "telephone": "+917823006185",
  "image": "https://riteshrv3-cmyk.github.io/bhagyshreedesign/images/og-cover.jpg",
  "url": "https://riteshrv3-cmyk.github.io/bhagyshreedesign/",
  "address": { "@type": "PostalAddress", "streetAddress": "Sai Park Society, Opposite Raisoni College", "addressLocality": "Wagholi, Pune", "postalCode": "412207", "addressRegion": "Maharashtra", "addressCountry": "IN" },
  "openingHoursSpecification": [{ "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], "opens": "10:00", "closes": "20:00" }],
  "priceRange": "₹"
}
</script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="mark" href="#top" aria-label="Bhagyshree Design, home">Bhagyshree <em>Design</em></a>
    <nav class="nav" aria-label="Sections">
      <a href="#work" data-i18n="nav_work"></a>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#visit" data-i18n="nav_visit"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="mr" aria-pressed="false">मराठी</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="kicker" data-i18n="hero_kicker"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="lede" data-i18n="hero_sub"></p>
        <div class="actions">
          <a class="btn btn-solid" data-wa data-i18n="btn_wa"></a>
          <a class="btn btn-line" data-call data-i18n="btn_call"></a>
        </div>
      </div>
      <div class="stack">
        <figure class="polaroid p1"><img src="images/pink-saree-green-blouse.jpg" width="652" height="1400" alt="Green brocade blouse with pink silk saree"><figcaption data-i18n="g3"></figcaption></figure>
        <figure class="polaroid p2"><img src="images/green-lehenga-jacket.jpg" width="1170" height="1400" alt="Green silk lehenga with brocade jacket"><figcaption data-i18n="g1"></figcaption></figure>
        <figure class="polaroid p3"><img src="images/green-blouse-gold-back.jpg" width="907" height="1400" alt="Green brocade blouse with gold lace open back" fetchpriority="high"><figcaption data-i18n="g2"></figcaption></figure>
      </div>
    </div>
  </section>

  <div class="facts">
    <div class="wrap facts-row">
      <span data-i18n="f1"></span><span data-i18n="f2"></span><span data-i18n="f3"></span><span data-i18n="f4"></span>
    </div>
  </div>

  <section id="work" class="section">
    <div class="wrap">
      <div class="head">
        <p class="num">I</p>
        <h2 data-i18n="work_title"></h2>
        <p class="note" data-i18n="work_note"></p>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="services" class="section alt">
    <div class="wrap">
      <div class="head">
        <p class="num">II</p>
        <h2 data-i18n="services_title"></h2>
        <p class="note" data-i18n="services_note"></p>
      </div>
      <ol class="list">
        <li><span class="idx">01</span><div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div></li>
        <li><span class="idx">02</span><div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div></li>
        <li><span class="idx">03</span><div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div></li>
        <li><span class="idx">04</span><div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></div></li>
        <li><span class="idx">05</span><div><h3 data-i18n="s5_t"></h3><p data-i18n="s5_d"></p></div></li>
      </ol>
    </div>
  </section>

  <section id="about" class="section">
    <div class="wrap about">
      <div class="head">
        <p class="num">III</p>
        <h2 data-i18n="about_title"></h2>
      </div>
      <blockquote data-i18n="about_quote"></blockquote>
      <p class="body" data-i18n="about_text"></p>
      <ul class="why">
        <li><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p></li>
        <li><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p></li>
        <li><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p></li>
        <li><h3 data-i18n="w4_t"></h3><p data-i18n="w4_d"></p></li>
      </ul>
    </div>
  </section>

  <section class="section alt">
    <div class="wrap">
      <div class="head">
        <p class="num">IV</p>
        <h2 data-i18n="steps_title"></h2>
      </div>
      <ol class="steps">
        <li><span class="idx">1</span><h3 data-i18n="st1_t"></h3><p data-i18n="st1_d"></p></li>
        <li><span class="idx">2</span><h3 data-i18n="st2_t"></h3><p data-i18n="st2_d"></p></li>
        <li><span class="idx">3</span><h3 data-i18n="st3_t"></h3><p data-i18n="st3_d"></p></li>
      </ol>
    </div>
  </section>

  <section id="enquiry" class="section">
    <div class="wrap enquiry-grid">
      <div class="head">
        <p class="num">V</p>
        <h2 data-i18n="form_title"></h2>
        <p class="note" data-i18n="form_note"></p>
      </div>
      <form class="card" id="enquiryForm">
        <label><span data-i18n="form_name"></span>
          <input name="custname" autocomplete="name" data-i18n-ph="form_name_ph">
        </label>
        <label><span data-i18n="form_item"></span>
          <select name="garment">
            <option value="" data-i18n="opt_choose"></option>
            <option data-i18n="s1_t"></option>
            <option data-i18n="s2_t"></option>
            <option data-i18n="s3_t"></option>
            <option data-i18n="s4_t"></option>
            <option data-i18n="opt_other"></option>
          </select>
        </label>
        <label><span data-i18n="form_date"></span>
          <input name="needby" type="date">
        </label>
        <button class="btn btn-solid" type="submit" data-i18n="form_send"></button>
        <p class="small" data-i18n="form_small"></p>
      </form>
    </div>
  </section>

  <section id="visit" class="section visit">
    <div class="wrap visit-grid">
      <div>
        <p class="num">VI</p>
        <h2 data-i18n="visit_title"></h2>
        <p class="lede" data-i18n="visit_sub"></p>
      </div>
      <dl class="info">
        <div><dt data-i18n="visit_addr"></dt><dd id="addr"></dd></div>
        <div><dt data-i18n="visit_hours"></dt><dd data-i18n="hours"></dd></div>
        <div><dt data-i18n="visit_phone"></dt><dd><a data-call id="phoneText"></a></dd></div>
        <div class="actions">
          <a class="btn btn-solid" data-wa data-i18n="btn_wa"></a>
          <a class="btn btn-line" id="mapBtn" target="_blank" rel="noopener" data-i18n="btn_map"></a>
        </div>
      </dl>
      <div class="map"><iframe id="mapFrame" title="Map: Bhagyshree Design, Wagholi, Pune" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-row">
    <span class="mark">Bhagyshree <em>Design</em></span>
    <span data-i18n="footer"></span>
    <a id="igLink" hidden target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<nav class="callbar" aria-label="Contact">
  <a data-call data-i18n="bar_call"></a>
  <a data-wa class="wa" data-i18n="bar_wa"></a>
</nav>

<dialog id="viewer" aria-label="Photo">
  <button class="close" aria-label="Close">&times;</button>
  <img alt="">
  <p></p>
  <a class="btn btn-solid ask" target="_blank" rel="noopener" data-i18n="btn_ask"></a>
</dialog>

<script src="js/config.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
